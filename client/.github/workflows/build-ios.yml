name: Build Unsigned iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      # This replaces the broken init step. It simply syncs your code to the existing ios folder.
      - name: Sync Web Assets to Capacitor iOS
        run: npx cap sync ios

      - name: Compile Unsigned Xcode App
        run: |
          xcodebuild clean build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into IPA Layout
        run: |
          mkdir -p Payload
          cp -R build-output/Build/Products/Release-iphoneos/App.app Payload/
          zip -r HabitTracker.ipa Payload

      - name: Upload Flashable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-habittracker-ipa
          path: HabitTracker.ipa